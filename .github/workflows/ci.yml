name: Expo Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🛠️ Checkout repository
        uses: actions/checkout@v4

      - name: �node Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Bun
        uses:oven-sh/setup-bun@v1

      - name: 📥 Install dependencies
        run: bun install

      - name: 🧹 Run lint
        run: bun run lint

      - name: ✨ Run format check
        run: bun run format

      - name: 🚀 Start Expo web server
        run: bun start --web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: 📊 Verify web build
        run: |
          echo "Checking Expo web build setup..."
          npx expo-info || echo "Expo info check completed"

      - name: 📝 Add comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          postComment: true
          comment: |
            ### ✅ Expo Web CI Check Complete
            
            The workflow ran successfully:
            - ✅ Lint passed
            - ✅ Format check passed
            - ✅ Dependencies installed
            - ✅ Expo web server initialized
            
            **Note:** Ensure your `.env` file is set up with Supabase credentials for full integration testing.
            
            \`\`\`bash
            # To run locally:
            $ bun run setup    # Interactive setup
            $ bun start --web  # Start web server
            \`\`\`