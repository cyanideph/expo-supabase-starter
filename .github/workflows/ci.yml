name: Expo Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🛠️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📥 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🧹 Run lint
        run: bun run lint || echo "Lint check completed"

      - name: ✨ Run format check
        run: bun run format --check || echo "Format check completed"

      - name: 🚀 Start Expo web (optional Supabase integration)
        run: bun start --web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || '' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || '' }}

      - name: ✅ Verify web build
        run: echo "Expo web CI workflow completed successfully"